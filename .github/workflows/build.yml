name: Build Meteor Addon

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Create Base Project Structure
        run: |
          # Генерируем настройки проекта
          cat << 'EOF' > settings.gradle
          rootProject.name = 'autogutta-addon'
          EOF

          # Генерируем конфигурацию сборки под Minecraft 1.21
          cat << 'EOF' > build.gradle
          plugins {
              id 'fabric-loom' version '1.7-SNAPSHOT'
          }
          version = '1.0.0'
          group = 'com.example'
          repositories {
              maven { url 'https://maven.meteordev.org/releases' }
              maven { url 'https://maven.meteordev.org/snapshots' }
              mavenCentral()
          }
          dependencies {
              minecraft "com.mojang:minecraft:1.21"
              mappings "net.fabricmc:yarn:1.21+build.2:v2"
              modImplementation "net.fabricmc:fabric-loader:0.15.11"
              modImplementation "meteordevelopment:meteor-client:0.5.8-SNAPSHOT"
          }
          EOF

          # Перемещаем файл мода в правильное место для Java
          mkdir -p src/main/java/com/example/addon
          if [ -f AddonTemplate.java ]; then
            mv AddonTemplate.java src/main/java/com/example/addon/
          fi

          # Генерируем информацию о моде для Fabric
          mkdir -p src/main/resources
          cat << 'EOF' > src/main/resources/fabric.mod.json
          {
            "schemaVersion": 1,
            "id": "autogutta-addon",
            "version": "1.0.0",
            "name": "AutoGutta Addon",
            "entrypoints": {
              "meteor": [ "com.example.addon.AddonTemplate" ]
            },
            "depends": {
              "fabricloader": ">=0.15.11",
              "minecraft": "~1.21",
              "meteor-client": "*"
            }
          }
          EOF

      - name: Build Mod with System Gradle
        run: gradle build --no-daemon

      - name: Upload Finished Jar
        uses: actions/upload-artifact@v4
        with:
          name: AutoGutta-Mod
          path: build/libs/*.jar
