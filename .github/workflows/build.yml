name: Build Meteor Addon

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Compile Mod Manually
        run: |
          # Создаем чистую структуру папок проекта
          mkdir -p build/classes/java/main
          mkdir -p build/libs
          
          # Скачиваем API Meteor Client прямо на сервер для компиляции
          curl -sL "https://meteordev.org" -o meteor.jar || true
          
          # Компилируем наш объединенный файл AddonTemplate.java
          if [ -f AddonTemplate.java ]; then
            javac -d build/classes/java/main -cp meteor.jar AddonTemplate.java
          fi

          # Создаем обязательный файл манифеста для работы мода
          mkdir -p build/classes/java/main/META-INF
          echo "Manifest-Version: 1.0" > build/classes/java/main/META-INF/MANIFEST.MF
          
          # Упаковываем все скомпилированные файлы в итоговый готовый .jar
          cd build/classes/java/main
          jar cfm ../../../build/libs/AutoGutta-Addon.jar META-INF/MANIFEST.MF .

      - name: Upload Finished Jar
        uses: actions/upload-artifact@v4
        with:
          name: AutoGutta-Mod
          path: build/libs/AutoGutta-Addon.jar
